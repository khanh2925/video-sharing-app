spring:
  application:
    name: video-sharing-api
  # Key AI trên máy mình (file không lên Git). Có file → AI tự bật; không có → bỏ qua.
  # Xem ai-local.example.yaml cùng thư mục.
  config:
    import: optional:classpath:ai-local.yaml
  datasource:
    url: jdbc:mysql://localhost:3307/video_sharing
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update        # Hibernate tự tạo / sửa bảng theo các lớp @Entity
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        # Đọc owner, topic, audio, hashtags (LAZY) của cả trang video bằng vài câu IN (...)
        # thay vì mỗi video một câu (lỗi N+1)
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # "Trần cứng" để chặn file quá lớn trước khi vào code.
      # Giới hạn thật do quản trị viên chỉnh (VIDEO_MAX_SIZE_MB), phải nhỏ hơn mức này.
      max-file-size: 500MB
      max-request-size: 510MB

server:
  port: 8080

# =====================================================================
# Cấu hình kỹ thuật của ứng dụng (đọc qua lớp AppProperties).
# Đổi số → lưu file → chạy lại backend, không phải sửa code.
# Thông số quản trị viên chỉnh trên app (độ dài story, dung lượng video...)
# KHÔNG nằm ở đây mà trong bảng system_settings (UC19).
# =====================================================================
app:
  upload-dir: uploads          # nơi lưu file người dùng upload (đã bỏ khỏi Git)
  seed-media-dir: seed-media   # video, ảnh mẫu cho DataSeeder

  jwt:
    # Khi chạy thật đặt biến môi trường JWT_SECRET (ít nhất 32 ký tự)
    secret: ${JWT_SECRET:vsa-2026-chuoi-bi-mat-mac-dinh-chi-dung-khi-dev-0123456789}
    expiration-days: 7

  upload:
    video-types: mp4,mov,webm
    image-types: jpg,jpeg,png,webp
    image-max-size-mb: 5

  paging:
    comment-page-size: 20      # số bình luận mỗi lần tải
    trending-size: 10          # số video ở mục Top trending
    suggestion-size: 10        # số tài khoản gợi ý

---
# =====================================================================
# Spring AI mặc định TẮT để backend chạy được khi chưa có API key (test, VPS).
# Khối này chỉ áp dụng khi KHÔNG chạy profile "ai": bỏ hẳn phần tự cấu hình Gemini và OpenAI,
# vì nó đòi key ngay lúc khởi động. Muốn bật AI: chạy profile "ai" (xem application-ai.yaml).
# =====================================================================
spring:
  config:
    activate:
      on-profile: "!ai"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
