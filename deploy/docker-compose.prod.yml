# Chạy toàn bộ hệ thống trên VPS: MySQL + pgvector (AI) + backend Spring Boot + Caddy (HTTPS tự động, kèm bản web của app).
# Dùng:  docker compose -f deploy/docker-compose.prod.yml up -d --build
# Biến (mật khẩu, JWT, DOMAIN) đọc từ deploy/.env – setup-vps.sh tự tạo file này.

name: vsa

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?thiếu MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: video_sharing
      MYSQL_USER: vsa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?thiếu MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    # Không mở cổng ra ngoài: chỉ backend trong mạng Docker gọi được MySQL.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Kho vector cho Spring AI (gợi ý video, tìm theo nghĩa, chatbot). Chỉ chứa vector,
  # dữ liệu nghiệp vụ vẫn ở MySQL. Không mở cổng ra ngoài, giống MySQL.
  vector-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsa
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-vsa}
      POSTGRES_DB: vsa_vectors
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsa -d vsa_vectors"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/video_sharing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: vsa
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_SHOWSQL: "false"
      SERVER_FORWARDHEADERSSTRATEGY: framework
      JWT_SECRET: ${JWT_SECRET:?thiếu JWT_SECRET}
      APP_UPLOADDIR: /app/uploads
      APP_SEEDMEDIADIR: /app/seed-media
      JAVA_OPTS: -Xms256m -Xmx2g
      # Spring AI: để trống = tắt. Bật bằng dòng SPRING_PROFILES_ACTIVE=ai trong deploy/.env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      APP_AI_VECTORDB_URL: jdbc:postgresql://vector-db:5432/vsa_vectors
      APP_AI_VECTORDB_PASSWORD: ${VECTOR_DB_PASSWORD:-vsa}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  # Trang web xem database (giống phpMyAdmin), mở ở https://<DOMAIN>/db/
  # Chỉ chạy khi deploy/.env có COMPOSE_PROFILES=dbpanel. Caddy khoá thêm một lớp mật khẩu phía trước
  # (DB_PANEL_USER, DB_PANEL_HASH). Đặt bằng: bash deploy/set-db-panel-password.sh
  adminer:
    image: adminer:4.8.1
    profiles: ["dbpanel"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    expose:
      - "8080"

  caddy:
    # Caddy + giao diện web của app (build từ mobile/ theo web.Dockerfile)
    build:
      context: ../mobile
      dockerfile: ../deploy/web.Dockerfile
      args:
        API_URL: https://${DOMAIN:?thiếu DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Mật khẩu lớp ngoài cho /db/. Mặc định là mã băm của một chuỗi ngẫu nhiên không ai biết
      # → trang luôn bị khoá cho tới khi chạy deploy/set-db-panel-password.sh
      DB_PANEL_USER: ${DB_PANEL_USER:-admin}
      DB_PANEL_HASH: ${DB_PANEL_HASH:-$$2a$$14$$vRfMggN5wWJVojVYKLbp4.ObuEQgJiMUClzrpaK.AqA4Sh0KJUIwa}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  pgvector_data:
  uploads:
  caddy_data:
  caddy_config:
