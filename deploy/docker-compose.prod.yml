# Chạy toàn bộ hệ thống trên VPS: MySQL + backend Spring Boot + Caddy (HTTPS tự động).
# Dùng:  docker compose -f deploy/docker-compose.prod.yml up -d --build
# Biến (mật khẩu, JWT, DOMAIN) đọc từ deploy/.env – setup-vps.sh tự tạo file này.

name: vsa

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?thiếu MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: video_sharing
      MYSQL_USER: vsa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?thiếu MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    # Không mở cổng ra ngoài: chỉ backend trong mạng Docker gọi được MySQL.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/video_sharing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: vsa
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_SHOWSQL: "false"
      SERVER_FORWARDHEADERSSTRATEGY: framework
      JWT_SECRET: ${JWT_SECRET:?thiếu JWT_SECRET}
      APP_UPLOADDIR: /app/uploads
      APP_SEEDMEDIADIR: /app/seed-media
      JAVA_OPTS: -Xms256m -Xmx2g
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
